name: Perbarui jadwal kajian

on:
  schedule:
    - cron: "17 21 * * *"   # 04:17 WIB, sebelum Subuh
    - cron: "17 9 * * *"    # 16:17 WIB, sebelum Maghrib
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: perbarui-jadwal
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Test parser
        run: python -m pytest -q

      - name: Ambil jadwal
        run: python -m scraper run --config sources.yaml --out data

      - name: Commit data bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: perbarui jadwal kajian $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
